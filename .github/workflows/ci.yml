name: Checks
on:
  push:
    branches: [backend/implementation]
  pull_request:
permissions:
  contents: read
jobs:
  backend-and-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - name: Backend regression tests
        run: python -m unittest discover -s tests -v
      - name: Echo Bot server tests
        run: python -m unittest discover -s demo -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Demo scene and interaction regression tests
        run: node --experimental-vm-modules --test tests/demo-*.test.mjs
      - name: Demo JavaScript syntax
        run: for file in demo/*.js; do node --input-type=module --check < "$file"; done
      - name: Build source distribution and wheel
        run: |
          python -m pip install "setuptools>=68"
          python -c "from setuptools.build_meta import build_sdist; build_sdist('work/sdist')"
          python -m pip wheel --no-deps --wheel-dir work/wheel work/sdist/*.tar.gz
      - name: Verify installed distribution outside source imports
        run: |
          python -m venv --system-site-packages work/installed
          work/installed/bin/python -m pip install --no-deps --force-reinstall work/wheel/*.whl
          work/installed/bin/python -I tools/check_distribution.py
