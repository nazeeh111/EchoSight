name: Checks
on:
  push:
    branches: [backend/implementation]
  pull_request:
permissions:
  contents: read
jobs:
  backend-and-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - name: Backend regression tests
        run: python -m unittest discover -s tests -v
      - name: Echo Bot server tests
        run: python -m unittest discover -s demo -p 'test_*.py' -v
      - name: Demo JavaScript syntax
        run: for file in demo/*.js; do node --input-type=module --check < "$file"; done
